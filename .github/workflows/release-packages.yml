name: Build Linux Packages

on:
  workflow_run:
    workflows: ["Detect Release from CHANGELOG"]
    types:
      - completed
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v0.1.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  # A push to main runs "Detect Release from CHANGELOG" every time, but it
  # creates a tag only when CHANGELOG.md gains a new version. Build only then:
  # rebuilding the newest old tag on every push re-uploaded its packages, and
  # failed outright once a packaging step needed files the old tag lacks.
  resolve:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      TAG: ${{ steps.get_tag.outputs.TAG }}
      VERSION: ${{ steps.get_tag.outputs.VERSION }}
      BUILD: ${{ steps.get_tag.outputs.BUILD }}
      IS_STABLE: ${{ steps.stable.outputs.IS_STABLE }}
    steps:
      - name: Get tag to build
        id: get_tag
        run: |
          BUILD=true
          if [ "${{ github.event_name }}" == "workflow_run" ]; then
            TAG=$(git -c 'versionsort.suffix=-alpha' -c 'versionsort.suffix=-beta' \
              ls-remote --tags --sort=-v:refname \
              https://github.com/${{ github.repository }} \
              | grep 'refs/tags/v' \
              | head -1 \
              | awk '{print $2}' \
              | sed 's#refs/tags/##' \
              | tr -d '{}^')
            # The tag the detect run created points at the commit it ran on;
            # an older tag does not, and then there is nothing new to build.
            TAG_COMMIT=$(git ls-remote https://github.com/${{ github.repository }} \
              "refs/tags/$TAG^{}" "refs/tags/$TAG" | sort -k2 -r | head -1 | awk '{print $1}')
            if [ "$TAG_COMMIT" != "${{ github.event.workflow_run.head_sha }}" ]; then
              echo "Newest tag $TAG is not on ${{ github.event.workflow_run.head_sha }}: no new release"
              BUILD=false
            fi
          elif [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "Building tag: $TAG ($BUILD)"
          echo "TAG=$TAG" >> "$GITHUB_OUTPUT"
          echo "VERSION=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "BUILD=$BUILD" >> "$GITHUB_OUTPUT"

      - name: Determine if stable release
        id: stable
        run: |
          TAG="${{ steps.get_tag.outputs.TAG }}"
          if [[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "IS_STABLE=true" >> "$GITHUB_OUTPUT"
          else
            echo "IS_STABLE=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: resolve
    if: ${{ needs.resolve.outputs.BUILD == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.TAG }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config nasm \
            libpulse-dev libclang-dev

      - name: Set package version
        run: |
          sed -i "0,/^version = \".*\"/s//version = \"${{ needs.resolve.outputs.VERSION }}\"/" linrdp/Cargo.toml

      - name: Build release binary
        run: cargo build --release -p linrdp

      - name: Install cargo-deb
        run: cargo install cargo-deb --locked

      - name: Build .deb package
        run: cargo deb -p linrdp --no-build --output target/debian/linrdp_${{ needs.resolve.outputs.VERSION }}_amd64.deb

      - name: Build .tar.gz archive
        run: |
          STAGE=$(mktemp -d)
          DIR="linrdp-${{ needs.resolve.outputs.VERSION }}-linux-amd64"
          mkdir -p "$STAGE/$DIR"
          install -m755 target/release/linrdp "$STAGE/$DIR/linrdp"
          install -m644 README.md LICENSE-MIT LICENSE-APACHE "$STAGE/$DIR/"
          tar -C "$STAGE" -czf "$DIR.tar.gz" "$DIR"
          sha256sum "$DIR.tar.gz" > "$DIR.tar.gz.sha256"

      - name: Build Arch Linux package
        run: |
          VERSION="${{ needs.resolve.outputs.VERSION }}"
          # pacman's pkgver allows no '-'; dropping it keeps a pre-release
          # (0.2.0beta.1) ordered before its release (0.2.0).
          PKGVER="${VERSION//-/}"
          STAGE=target/arch
          rm -rf "$STAGE" && mkdir -p "$STAGE"
          cp linrdp/arch/PKGBUILD linrdp/arch/linrdp.install "$STAGE/"
          cp target/release/linrdp README.md CHANGELOG.md LICENSE-MIT LICENSE-APACHE "$STAGE/"
          sed -i "s/^pkgver=.*/pkgver=$PKGVER/" "$STAGE/PKGBUILD"
          # makepkg refuses to run as root; the binary is already built, so
          # --nodeps skips installing the runtime dependencies.
          docker run --rm -v "$PWD/$STAGE:/pkg" -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
            archlinux:latest bash -euc '
              pacman -Syu --noconfirm --needed base-devel >/dev/null
              useradd -m builder
              chown -R builder /pkg
              su builder -c "cd /pkg && makepkg --nodeps --noconfirm"
              chown -R "$HOST_UID:$HOST_GID" /pkg
            '
          PKG="$STAGE/linrdp-$PKGVER-1-x86_64.pkg.tar.zst"
          test -f "$PKG"
          sha256sum "$PKG" > "$PKG.sha256"
          echo "ARCH_PKG=$PKG" >> "$GITHUB_ENV"

      - name: Checksum the .deb
        run: |
          DEB=target/debian/linrdp_${{ needs.resolve.outputs.VERSION }}_amd64.deb
          sha256sum "$DEB" > "$DEB.sha256"

      - name: Upload packages to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve.outputs.TAG }}
          prerelease: ${{ needs.resolve.outputs.IS_STABLE == 'false' }}
          files: |
            linrdp-${{ needs.resolve.outputs.VERSION }}-linux-amd64.tar.gz
            linrdp-${{ needs.resolve.outputs.VERSION }}-linux-amd64.tar.gz.sha256
            target/debian/linrdp_${{ needs.resolve.outputs.VERSION }}_amd64.deb
            target/debian/linrdp_${{ needs.resolve.outputs.VERSION }}_amd64.deb.sha256
            ${{ env.ARCH_PKG }}
            ${{ env.ARCH_PKG }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Job Summary
        run: |
          {
            echo "## Package Build Summary"
            echo
            echo "Built \`${{ needs.resolve.outputs.TAG }}\` for linux/amd64:"
            echo
            echo "- \`linrdp-${{ needs.resolve.outputs.VERSION }}-linux-amd64.tar.gz\`"
            echo "- \`linrdp_${{ needs.resolve.outputs.VERSION }}_amd64.deb\`"
            echo "- \`$(basename "$ARCH_PKG")\`"
            echo
            echo "### Install (Debian/Ubuntu)"
            echo '```bash'
            echo "sudo apt install ./linrdp_${{ needs.resolve.outputs.VERSION }}_amd64.deb"
            echo '```'
            echo
            echo "### Install (Arch Linux)"
            echo '```bash'
            echo "sudo pacman -U ./$(basename "$ARCH_PKG")"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
